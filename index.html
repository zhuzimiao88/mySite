<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情绪拾荒｜Emotion Scavenger</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  overflow:hidden;
  font-family:system-ui, -apple-system, sans-serif;
  color:#fff;
}
/* ========== 开篇介绍页面 ========== */
.intro-page{
  position:fixed;
  inset:0;
  background:#04040a;
  z-index:10;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px;
  transition: opacity 1.2s ease, transform 1.2s ease;
}
.intro-page.fade-out{
  opacity:0;
  pointer-events:none;
  transform:scale(1.05);
}
.intro-bg-glow{
  position:absolute;
  width:700px;
  height:700px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(160,200,255,0.18) 0%, rgba(0,0,0,0) 70%);
  filter:blur(80px);
  z-index:-1;
}
.intro-title{
  font-size:52px;
  letter-spacing:10px;
  margin-bottom:14px;
  color:#dcebff;
}
.intro-sub{
  font-size:16px;
  opacity:0.6;
  letter-spacing:4px;
  margin-bottom:36px;
}
.intro-desc{
  max-width:640px;
  text-align:center;
  line-height:1.9;
  opacity:0.75;
  font-size:15px;
  margin-bottom:40px;
}
.gesture-tip{
  font-size:13px;
  opacity:0.55;
  margin-bottom:36px;
  line-height:1.8;
  text-align:center;
}
.enter-btn{
  padding:14px 42px;
  border:1px solid rgba(180,220,255,0.4);
  background:rgba(255,255,255,0.04);
  color:#dcebff;
  border-radius:999px;
  font-size:16px;
  letter-spacing:2px;
  cursor:pointer;
  transition:all 0.4s ease;
}
.enter-btn:hover{
  background:rgba(140,190,255,0.12);
  border-color:rgba(180,220,255,0.8);
  box-shadow:0 0 22px rgba(120,180,255,0.25);
}

/* ========== 交互主页面 ========== */
.main-page{
  position:fixed;
  inset:0;
  opacity:0;
  pointer-events:none;
  transition: opacity 1s ease;
}
.main-page.active{
  opacity:1;
  pointer-events:auto;
}
canvas#mainCanvas{
  display:block;
  position:fixed;
  top:0;left:0;
  z-index:1;
}
video{
  position:fixed;
  top:16px;
  right:16px;
  width:220px;
  transform:scaleX(-1);
  opacity:0.5;
  z-index:2;
  border-radius:10px;
}
.info{
  position:fixed;
  top:24px;
  left:24px;
  z-index:3;
  line-height:1.6;
}
.guide{
  font-size:14px;
  opacity:0.7;
}
.emotion-tag{
  font-size:26px;
  margin-top:10px;
  font-weight:600;
  letter-spacing:2px;
}
.emotion-desc{
  font-size:13px;
  opacity:0.65;
  margin-top:6px;
  max-width:280px;
}
.audio-tip{
  position:fixed;
  bottom:30px;
  left:24px;
  color:#fff;
  font-size:14px;
  opacity:0.6;
  z-index:3;
}
</style>
</head>
<body>

<!-- 开篇介绍页 -->
<div class="intro-page" id="intro">
  <div class="intro-bg-glow"></div>
  <h1 class="intro-title">情绪拾荒</h1>
  <div class="intro-sub">EMOTION SCAVENGER</div>
  <div class="intro-desc">
    情绪是漂浮在空间里看不见的碎片。<br>
    伸出你的手，成为情绪的拾荒者。<br>
    不同手势唤醒不同情绪场域，粒子、光晕与声音随掌心一同变化。<br>
    在流动的光影里，拾取、感受、释放情绪。
  </div>
  <div class="gesture-tip">
    ✋ 五指张开｜平静｜水母浮影<br>
    👉 伸出食指｜期待｜微光种子<br>
    ✌️ V字手势｜喜悦｜蝴蝶花瓣<br>
    ✊ 握拳｜压抑｜沉坠碎片<br>
    👍 竖大拇指｜治愈｜白莲柔光
  </div>
  <button class="enter-btn" id="enterBtn">进入情绪拾荒</button>
</div>

<!-- 交互主页面 -->
<div class="main-page" id="main">
  <div class="info">
    <div class="guide">✋五指张开｜👉单食指｜✌️V字｜✊拳头｜👍拇指向上</div>
    <div class="emotion-tag" id="emotionText">平静</div>
    <div class="emotion-desc" id="descText">呼吸像海流，缓慢起伏，也像时间在轻轻流动</div>
  </div>
  <div class="audio-tip" id="audioTip">点击画面任意位置 → 开启情绪声音</div>

  <video id="video" autoplay playsinline></video>
  <canvas id="mainCanvas"></canvas>

  <audio id="audio-calm" loop preload="auto">
    <source src="calm.mp3" type="audio/mpeg">
  
  <audio id="audio-hope" loop preload="auto">
    <source src="hope.mp3" type="audio/mpeg">
  
  <audio id="audio-joy" loop preload="auto">
    <source src="joy.mp3" type="audio/mpeg">
  
  <audio id="audio-depress" loop preload="auto">
    <source src="depress.mp3" type="audio/mpeg">
  
  <audio id="audio-heal" loop preload="auto">
    <source src="heal.mp3" type="audio/mpeg">
  
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script>
const introPage = document.getElementById('intro');
const mainPage = document.getElementById('main');
const enterBtn = document.getElementById('enterBtn');
let enterFlag = false;

enterBtn.onclick = ()=>{
  if(enterFlag) return;
  enterFlag = true;
  introPage.classList.add('fade-out');
  setTimeout(()=>{
    mainPage.classList.add('active');
    startMainScene();
  }, 800);
}

function startMainScene(){
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const video = document.getElementById('video');
const emotionText = document.getElementById('emotionText');
const descText = document.getElementById('descText');
const audioTip = document.getElementById('audioTip');

let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;
window.addEventListener('resize',()=>{
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
})

// ========== 情绪视觉配置 ==========
const emotionConfig = {
  calm: {
    name:"平静",
    desc:"深海般的呼吸，透明水母在柔光里缓缓漂浮",
    hue:200,
    hue2:220,
    sat:50,
    light:65,
    force:0.012,
    speed:0.99,
    mode:"float",
    minR:0.6,
    maxR:2,
    alpha:0.5,
    bg:"#060914",
    glow:"rgba(140,200,255,0.16)",
    particleShape:"softDot",
    symbol:"jellyfish",
    aura:"softWave",
    textColor:"#c7e2ff"
  },
  hope: {
    name:"期待",
    desc:"掌心释放微光种子，在黑暗里一点点被点亮",
    hue:40,
    hue2:55,
    sat:85,
    light:68,
    force:0.08,
    speed:1.015,
    mode:"burst",
    minR:0.8,
    maxR:2.6,
    alpha:0.7,
    bg:"#141008",
    glow:"rgba(255,210,120,0.22)",
    particleShape:"starDust",
    symbol:"seed",
    aura:"lightRing",
    textColor:"#ffe9b0"
  },
  joy: {
    name:"喜悦",
    desc:"蝴蝶从手心飞起，花瓣光斑在空间里轻盈旋转",
    hue:300,
    hue2:330,
    sat:78,
    light:66,
    force:0.055,
    speed:0.992,
    mode:"rotate",
    minR:1,
    maxR:2.8,
    alpha:0.72,
    bg:"#130818",
    glow:"rgba(255,150,220,0.2)",
    particleShape:"petal",
    symbol:"butterfly",
    aura:"spiralPetal",
    textColor:"#ffd1f2"
  },
  depress: {
    name:"压抑",
    desc:"光线碎裂成黑色雨滴，缓慢下沉，像情绪沉入谷底",
    hue:220,
    hue2:240,
    sat:14,
    light:40,
    force:0.005,
    speed:0.92,
    mode:"sink",
    minR:0.4,
    maxR:1.4,
    alpha:0.35,
    bg:"#07070f",
    glow:"rgba(120,130,160,0.1)",
    particleShape:"shard",
    symbol:"darkRain",
    aura:"heavyMist",
    textColor:"#9aa7c7"
  },
  heal: {
    name:"治愈",
    desc:"白莲在掌心绽放，柔光羽翼抚平空间里的躁动",
    hue:160,
    hue2:185,
    sat:68,
    light:66,
    force:0.04,
    speed:0.984,
    mode:"smooth",
    minR:0.9,
    maxR:2.4,
    alpha:0.68,
    bg:"#071311",
    glow:"rgba(150,255,220,0.2)",
    particleShape:"cloud",
    symbol:"lotus",
    aura:"healPulse",
    textColor:"#c6ffe9"
  }
}

let currentEmotion = emotionConfig.calm;
let transitionHue = currentEmotion.hue;
let transitionHue2 = currentEmotion.hue2;
let transitionSat = currentEmotion.sat;
let transitionLight = currentEmotion.light;

// ========== 音频系统 ==========
const audioMap = {
  calm: document.getElementById('audio-calm'),
  hope: document.getElementById('audio-hope'),
  joy: document.getElementById('audio-joy'),
  depress: document.getElementById('audio-depress'),
  heal: document.getElementById('audio-heal')
};
const BASE_VOL = 0.4;
let currentAudioKey = "calm";
let audioStarted = false;
const fadeSpeed = 0.025;

Object.values(audioMap).forEach(a=> a.volume = 0);

document.body.addEventListener('click', ()=>{
  if(!audioStarted){
    audioStarted = true;
    audioTip.style.opacity = 0;
    audioMap[currentAudioKey].play();
  }
})

function switchAudio(newKey){
  if(newKey === currentAudioKey) return;
  currentAudioKey = newKey;
  audioMap[currentAudioKey].play();
}

function audioFadeTick(){
  for(let key in audioMap){
    const a = audioMap[key];
    if(key === currentAudioKey){
      if(a.volume < BASE_VOL) a.volume = Math.min(BASE_VOL, a.volume + fadeSpeed);
    }else{
      if(a.volume > 0) a.volume = Math.max(0, a.volume - fadeSpeed);
    }
  }
}

// ========== 背景氛围层 ==========
class BackgroundField{
  constructor(){
    this.points = [];
    for(let i=0;i<120;i++){
      this.points.push({
        x: Math.random()*w,
        y: Math.random()*h,
        vx: (Math.random()-0.5)*0.15,
        vy: (Math.random()-0.5)*0.15,
        r: Math.random()*1.2 + 0.3
      })
    }
  }
  update(){
    for(let p of this.points){
      p.x += p.vx;
      p.y += p.vy;
      if(p.x<0) p.x = w;
      if(p.x>w) p.x = 0;
      if(p.y<0) p.y = h;
      if(p.y>h) p.y = 0;
    }
  }
  draw(){
    for(let p of this.points){
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${transitionHue}, ${transitionSat}%, ${transitionLight}%, 0.22)`;
      ctx.fill();
    }
  }
}
const bgField = new BackgroundField();

// ========== 主粒子系统 ==========
class Particle{
  constructor(){
    this.reset();
  }
  reset(handX, handY){
    if(Math.random() < 0.3){
      this.x = handX + (Math.random()-0.5)*80;
      this.y = handY + (Math.random()-0.5)*80;
    }else{
      this.x = Math.random()*w;
      this.y = Math.random()*h;
    }
    this.vx = (Math.random()-0.5)*0.5;
    this.vy = (Math.random()-0.5)*0.5;
    this.life = Math.random();
    this.maxLife = 0.8 + Math.random()*0.4;
  }
  update(handX, handY){
    const cfg = currentEmotion;
    const dx = handX - this.x;
    const dy = handY - this.y;
    const dist = Math.hypot(dx, dy);

    this.life -= 0.0014;
    if(this.life <= 0){
      this.reset(handX, handY);
      this.life = this.maxLife;
    }

    if(dist < 160){
      const f = (160 - dist)/160 * cfg.force;
      switch(cfg.mode){
        case "float":
          this.vx += dx * f * 0.4;
          this.vy += dy * f * 0.4;
          this.vy += Math.sin(Date.now()*0.0008 + this.x*0.01)*0.003;
          break;
        case "burst":
          this.vx -= dx * f * 1.0;
          this.vy -= dy * f * 1.0;
          this.vx += (Math.random()-0.5)*0.25;
          this.vy += (Math.random()-0.5)*0.25;
          break;
        case "rotate":
          const temp = this.vx;
          this.vx = -this.vy * 0.35 + this.vx + dx*f*0.4;
          this.vy = temp * 0.35 + this.vy + dy*f*0.4;
          break;
        case "sink":
          this.vy += 0.014;
          this.vx += dx * f * 0.15;
          this.vy += dy * f * 0.15;
          break;
        case "smooth":
          this.vx += dx * f * 0.45;
          this.vy += dy * f * 0.45;
          this.vx *= 0.94;
          this.vy *= 0.94;
          break;
      }
    }

    this.vx *= cfg.speed;
    this.vy *= cfg.speed;
    this.x += this.vx;
    this.y += this.vy;

    if(this.x<-50||this.x>w+50||this.y<-50||this.y>h+50){
      this.reset(handX, handY);
    }
  }
  draw(){
    const cfg = currentEmotion;
    const lifeN = Math.max(0, this.life / this.maxLife);
    const r = (cfg.minR + Math.random()*(cfg.maxR - cfg.minR)) * (0.5 + lifeN*0.5);
    const a = cfg.alpha * lifeN;
    const hue = Math.random() < 0.5 ? transitionHue : transitionHue2;

    ctx.save();

    if(cfg.particleShape === "softDot"){
      ctx.beginPath();
      ctx.arc(this.x, this.y, r*1.4, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${hue}, ${transitionSat}%, ${transitionLight}%, ${a*0.4})`;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(this.x, this.y, r, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${hue}, ${transitionSat}%, ${transitionLight+8}%, ${a})`;
      ctx.fill();
    }else if(cfg.particleShape === "starDust"){
      ctx.beginPath();
      ctx.arc(this.x, this.y, r, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${hue}, ${transitionSat}%, ${transitionLight+12}%, ${a})`;
      ctx.shadowBlur = 14;
      ctx.shadowColor = `hsla(${hue}, 100%, 70%, 0.9)`;
      ctx.fill();
      ctx.shadowBlur = 0;
    }else if(cfg.particleShape === "petal"){
      ctx.translate(this.x, this.y);
      ctx.rotate(Date.now()*0.001 + this.x);
      ctx.beginPath();
      ctx.ellipse(0, 0, r*1.6, r*0.6, 0, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${hue}, ${transitionSat}%, ${transitionLight+6}%, ${a})`;
      ctx.fill();
    }else if(cfg.particleShape === "shard"){
      ctx.translate(this.x, this.y);
      ctx.rotate(Date.now()*0.002 + this.x);
      ctx.fillStyle = `hsla(${hue}, ${transitionSat}%, ${transitionLight}%, ${a})`;
      ctx.fillRect(-r*0.7, -r*0.3, r*1.4, r*0.6);
    }else if(cfg.particleShape === "cloud"){
      ctx.beginPath();
      ctx.arc(this.x, this.y, r*1.8, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${hue}, ${transitionSat}%, ${transitionLight}%, ${a*0.45})`;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(this.x, this.y, r, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${hue}, ${transitionSat}%, ${transitionLight+10}%, ${a})`;
      ctx.fill();
    }else{
      ctx.beginPath();
      ctx.arc(this.x, this.y, r, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${hue}, ${transitionSat}%, ${transitionLight}%, ${a})`;
      ctx.fill();
    }

    ctx.restore();
  }
}

const particles = [];
for(let i=0;i<800;i++) particles.push(new Particle())

// ========== 代表物系统：每种情绪不同符号【优化蝴蝶】 ==========
class EmotionSymbol{
  constructor(){
    this.list = [];
    this.MAX_BUTTERFLY = 12; // 限制蝴蝶最大数量，防止无限爆
  }
  spawn(handX, handY){
    const cfg = currentEmotion;
    if(cfg.symbol === "jellyfish" && Math.random() < 0.02){
      this.list.push({
        type:"jellyfish",
        x: handX + (Math.random()-0.5)*120,
        y: handY + (Math.random()-0.5)*120,
        vx:(Math.random()-0.5)*0.3,
        vy:-0.4 - Math.random()*0.3,
        r:14 + Math.random()*10,
        life:1,
        phase:Math.random()*Math.PI*2
      });
    }
    if(cfg.symbol === "seed" && Math.random() < 0.04){
      this.list.push({
        type:"seed",
        x: handX,
        y: handY,
        vx:(Math.random()-0.5)*1.2,
        vy:-1.2 - Math.random()*0.6,
        r:2 + Math.random()*1.5,
        life:1,
        glow:0
      });
    }
    // 蝴蝶：限制数量，降低生成概率
    if(cfg.symbol === "butterfly" && Math.random() < 0.018){
      const bCount = this.list.filter(s=>s.type==='butterfly').length;
      if(bCount < this.MAX_BUTTERFLY){
        this.list.push({
          type:"butterfly",
          x: handX + (Math.random()-0.5)*100,
          y: handY + (Math.random()-0.5)*100,
          vx:(Math.random()-0.5)*0.8,
          vy:(Math.random()-0.5)*0.8,
          r:6 + Math.random()*4,
          life:1,
          wingPhase:Math.random()*Math.PI*2
        });
      }
    }
    if(cfg.symbol === "darkRain" && Math.random() < 0.06){
      this.list.push({
        type:"darkRain",
        x: Math.random()*w,
        y: -10,
        vx:(Math.random()-0.5)*0.2,
        vy:1.2 + Math.random()*0.8,
        r:1 + Math.random()*1.6,
        life:1
      });
    }
    if(cfg.symbol === "lotus" && Math.random() < 0.025){
      this.list.push({
        type:"lotus",
        x: handX + (Math.random()-0.5)*100,
        y: handY + (Math.random()-0.5)*60,
        r:10 + Math.random()*8,
        life:1,
        open:0,
        angle:Math.random()*Math.PI*2
      });
    }
  }
  update(timeNow){
    for(let i=this.list.length-1;i>=0;i--){
      let s = this.list[i];
      s.life -= 0.002;

      if(s.type === "jellyfish"){
        s.x += s.vx + Math.sin(timeNow*0.002 + s.phase)*0.3;
        s.y += s.vy;
        s.phase += 0.08;
        if(s.y < -40 || s.life <= 0) this.list.splice(i,1);
      }

      if(s.type === "seed"){
        s.x += s.vx;
        s.y += s.vy;
        s.vy += 0.015;
        s.glow += 0.04;
        if(s.y > h+20 || s.life <= 0) this.list.splice(i,1);
      }

      if(s.type === "butterfly"){
        s.x += s.vx + Math.sin(timeNow*0.01 + s.wingPhase)*0.6;
        s.y += s.vy + Math.cos(timeNow*0.008 + s.wingPhase)*0.4;
        s.wingPhase += 0.25;
        if(s.life <= 0) this.list.splice(i,1);
      }

      if(s.type === "darkRain"){
        s.x += s.vx;
        s.y += s.vy;
        if(s.y > h+20 || s.life <= 0) this.list.splice(i,1);
      }

      if(s.type === "lotus"){
        s.open += 0.015;
        s.angle += 0.005;
        if(s.open > 1.6 || s.life <= 0) this.list.splice(i,1);
      }
    }
  }
  draw(timeNow){
    ctx.shadowBlur = 0; // 全局提前关闭阴影，只在必要时开启
    for(let s of this.list){
      ctx.save();

      if(s.type === "jellyfish"){
        ctx.translate(s.x, s.y);
        ctx.beginPath();
        ctx.arc(0, 0, s.r, Math.PI, 0);
        ctx.strokeStyle = `hsla(${transitionHue}, 60%, 70%, ${s.life})`;
        ctx.lineWidth = 1.2;
        ctx.shadowBlur = 12;
        ctx.shadowColor = `hsla(${transitionHue}, 100%, 70%, 0.8)`;
        ctx.stroke();
        ctx.shadowBlur = 0;
        for(let i=0;i<6;i++){
          ctx.beginPath();
          ctx.moveTo(-s.r*0.6 + i*s.r*0.24, s.r*0.3);
          ctx.quadraticCurveTo(
            -s.r*0.6 + i*s.r*0.24 + Math.sin(s.phase+i)*2,
            s.r*0.8,
            -s.r*0.6 + i*s.r*0.24,
            s.r*1.4
          );
          ctx.strokeStyle = `hsla(${transitionHue}, 60%, 70%, ${s.life*0.7})`;
          ctx.stroke();
        }
      }

      if(s.type === "seed"){
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
        ctx.fillStyle = `hsla(${transitionHue}, 100%, 70%, ${s.life})`;
        ctx.shadowBlur = 20 + s.glow;
        ctx.shadowColor = `hsla(${transitionHue}, 100%, 70%, 1)`;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // ===== 蝴蝶【重点优化，移除每只的shadowBlur】=====
      if(s.type === "butterfly"){
        ctx.translate(s.x, s.y);
        ctx.rotate(Math.atan2(s.vy, s.vx));
        const w = Math.sin(s.wingPhase) * s.r;
        ctx.beginPath();
        ctx.ellipse(-s.r*0.6, 0, w*0.9, s.r*0.5, 0, 0, Math.PI*2);
        ctx.ellipse(s.r*0.6, 0, w*0.9, s.r*0.5, 0, 0, Math.PI*2);
        ctx.fillStyle = `hsla(${transitionHue}, 80%, 65%, ${s.life})`;
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(0, 0, s.r*0.2, s.r*0.8, 0, 0, Math.PI*2);
        ctx.fillStyle = `hsla(${transitionHue2}, 80%, 60%, ${s.life})`;
        ctx.fill();
      }

      if(s.type === "darkRain"){
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x, s.y + s.r*3);
        ctx.strokeStyle = `hsla(${transitionHue}, 20%, 40%, ${s.life*0.8})`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      if(s.type === "lotus"){
        ctx.translate(s.x, s.y);
        ctx.rotate(s.angle);
        for(let i=0;i<8;i++){
          ctx.rotate(Math.PI / 4);
          ctx.beginPath();
          ctx.ellipse(s.r*0.6, 0, s.r*0.35, s.r*0.9, 0, 0, Math.PI*2);
          ctx.fillStyle = `hsla(${transitionHue}, 60%, 72%, ${s.life*0.85})`;
          ctx.fill();
        }
        ctx.beginPath();
        ctx.arc(0, 0, s.r*0.35, 0, Math.PI*2);
        ctx.fillStyle = `hsla(${transitionHue2}, 70%, 75%, ${s.life})`;
        ctx.fill();
      }

      ctx.restore();
    }
  }
}
const symbols = new EmotionSymbol();

// ========== 情绪光环系统 ==========
class EmotionAura{
  constructor(){
    this.rings = [];
    this.spirals = [];
  }
  update(handX, handY){
    const cfg = currentEmotion;

    if(cfg.aura === "softWave" && Math.random() < 0.04){
      this.rings.push({x:handX, y:handY, r:20, maxR:260, a:0.35});
    }
    if(cfg.aura === "lightRing" && Math.random() < 0.1){
      this.rings.push({x:handX, y:handY, r:10, maxR:200, a:0.45});
    }
    if(cfg.aura === "spiralPetal" && Math.random() < 0.12){
      this.spirals.push({
        x: handX,
        y: handY,
        angle: Math.random()*Math.PI*2,
        speed: 0.04 + Math.random()*0.02,
        r: 2,
        maxR: 160,
        a: 0.55
      })
    }
    if(cfg.aura === "healPulse" && Math.random() < 0.06){
      this.rings.push({x:handX, y:handY, r:16, maxR:300, a:0.3});
    }

    for(let i=this.rings.length-1;i>=0;i--){
      let ring = this.rings[i];
      ring.r += 2;
      ring.a -= 0.005;
      if(ring.a <= 0 || ring.r >= ring.maxR) this.rings.splice(i,1);
    }

    for(let i=this.spirals.length-1;i>=0;i--){
      let s = this.spirals[i];
      s.angle += s.speed;
      s.r += 0.8;
      s.x += Math.cos(s.angle)*1;
      s.y += Math.sin(s.angle)*1;
      s.a -= 0.0035;
      if(s.a <= 0 || s.r >= s.maxR) this.spirals.splice(i,1);
    }
  }
  draw(){
    const cfg = currentEmotion;
    ctx.shadowBlur = 0;

    for(let ring of this.rings){
      ctx.beginPath();
      ctx.arc(ring.x, ring.y, ring.r, 0, Math.PI*2);
      ctx.strokeStyle = `hsla(${transitionHue}, ${transitionSat}%, ${transitionLight}%, ${ring.a})`;
      ctx.lineWidth = 1.3;
      ctx.stroke();
    }

    for(let s of this.spirals){
      ctx.beginPath();
      ctx.arc(s.x, s.y, 2.2, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${transitionHue2}, ${transitionSat}%, ${transitionLight+8}%, ${s.a})`;
      ctx.fill();
    }

    if(cfg.aura === "softWave"){
      const g = ctx.createRadialGradient(handX, handY, 10, handX, handY, 240);
      g.addColorStop(0, `hsla(${transitionHue}, 60%, 60%, 0.22)`);
      g.addColorStop(1, `hsla(${transitionHue}, 60%, 60%, 0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(handX, handY, 240, 0, Math.PI*2);
      ctx.fill();
    }

    if(cfg.aura === "heavyMist"){
      const g = ctx.createRadialGradient(handX, handY, 10, handX, handY, 220);
      g.addColorStop(0, `hsla(${transitionHue}, 20%, 30%, 0.28)`);
      g.addColorStop(1, `hsla(${transitionHue}, 20%, 30%, 0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(handX, handY, 220, 0, Math.PI*2);
      ctx.fill();
    }

    if(cfg.aura === "healPulse"){
      const g = ctx.createRadialGradient(handX, handY, 10, handX, handY, 260);
      g.addColorStop(0, `hsla(${transitionHue}, 70%, 65%, 0.25)`);
      g.addColorStop(1, `hsla(${transitionHue}, 70%, 65%, 0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(handX, handY, 260, 0, Math.PI*2);
      ctx.fill();
    }
  }
}
const aura = new EmotionAura();

// ========== 手势识别 ==========
let handX = w/2, handY = h/2;
function detectGesture(landmarks){
  const tip = [4,8,12,16,20];
  const pip = [3,6,10,14,18];
  let extend = [];
  for(let i=0;i<5;i++){
    const t = landmarks[tip[i]];
    const p = landmarks[pip[i]];
    extend.push(t.y < p.y);
  }
  const [thumb, index, middle, ring, pinky] = extend;

  if(index && middle && ring && pinky && thumb) return "calm";
  if(index && !middle && !ring && !pinky && !thumb) return "hope";
  if(index && middle && !ring && !pinky) return "joy";
  if(!index && !middle && !ring && !pinky && !thumb) return "depress";
  if(thumb && !index && !middle && !ring && !pinky) return "heal";
  return null;
}

const hands = new Hands({locateFile: (file)=>{
  return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
}});
hands.setOptions({
  maxNumHands:1,
  modelComplexity:1,
  minDetectionConfidence:0.7,
  minTrackingConfidence:0.5
});
hands.onResults((res)=>{
  if(res.multiHandLandmarks.length>0){
    const lm = res.multiHandLandmarks[0];
    handX = (1 - lm[0].x) * w;
    handY = lm[0].y * h;
    const ges = detectGesture(lm);
    if(ges){
      currentEmotion = emotionConfig[ges];
      emotionText.innerText = currentEmotion.name;
      descText.innerText = currentEmotion.desc;
      descText.style.color = currentEmotion.textColor;
      switchAudio(ges);
    }
  }
})
const camera = new Camera(video, {
  onFrame: async ()=>{ await hands.send({image:video}) },
  width:640, height:480
});
camera.start();

// ========== 主循环 ==========
function animate(time){
  const cfg = currentEmotion;
  const nowT = time;

  transitionHue += (cfg.hue - transitionHue) * 0.02;
  transitionHue2 += (cfg.hue2 - transitionHue2) * 0.02;
  transitionSat += (cfg.sat - transitionSat) * 0.02;
  transitionLight += (cfg.light - transitionLight) * 0.02;

  ctx.fillStyle = cfg.bg;
  ctx.globalAlpha = 0.18;
  ctx.fillRect(0,0,w,h);
  ctx.globalAlpha = 1;

  const globalGlow = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, Math.max(w,h)*0.7);
  globalGlow.addColorStop(0, cfg.glow);
  globalGlow.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = globalGlow;
  ctx.fillRect(0,0,w,h);

  bgField.update();
  bgField.draw();

  aura.update(handX, handY);
  aura.draw();

  symbols.spawn(handX, handY);
  symbols.update(nowT);
  symbols.draw(nowT);

  for(let p of particles){
    p.update(handX, handY);
    p.draw();
  }

  audioFadeTick();
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
}
